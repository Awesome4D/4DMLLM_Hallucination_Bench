name: Reproduce archived-response audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reproduce.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reproduce-archived-audit
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Verify committed source data without external downloads
        run: python scripts/materialize_paper_data.py
      - name: Test and reproduce all analysis
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q
          python -m lidar_hallu.analyze --dataset data/b4dl_dataset --predictions data/b4dl_eval --output results
          python -m lidar_hallu.priors --dataset data/b4dl_dataset --output results
          python -m lidar_hallu.conflicts --predictions data/b4dl_eval --output results
      - name: Save recomputed summaries, preserving original prediction files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results
          if ! git diff --cached --quiet; then
            git commit -m 'Reproduce 100k-response audit directly from committed source data [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
